name: JEE12 PR109 independent review02 source and native
on:
  push:
    branches:
      - review/conductor-pr109-chat-b-r2-20261120
    paths:
      - ".github/workflows/jee12-pr109-review02.yml"
      - "projects/conductor_sim/pr-109/reviews/review-02-chat-b-native.py"
  workflow_dispatch:

permissions:
  contents: read
env:
  PROD_SHA: 975e2e23a86fe29bbaafebc20e684312d2aa5b6d
  PROD_TREE: ddcc0b9923584495f78e2ea05a7f1ff56622e8d2

jobs:
  workbook-pdf-source:
    name: Real original workbook 8 page JPEGs and binary hash
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: 975e2e23a86fe29bbaafebc20e684312d2aa5b6d
          path: source
          persist-credentials: false
      - name: Verify pinned production Git commit and native tree
        run: |
          test "$(git -C source rev-parse HEAD)" = "$PROD_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$PROD_TREE"
          git -C source rev-parse HEAD HEAD^{tree}
      - name: Hash ORIGINAL workbook binary and render 8 PDF pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/workbook
          test "$(sha256sum source/02_conductors_half_size.pdf | awk '{print $1}')" = "9dff3c02a9f1848d2c3d99cb1a6e7a44dc7f5a51f7a3a2b8cc92d10ce1fbca5d"
          sha256sum source/02_conductors_half_size.pdf | tee evidence/workbook/real-source-sha256.txt
          pdfinfo source/02_conductors_half_size.pdf | head -25 | tee evidence/workbook/pdfinfo.txt
          command -v pdftoppm
          for p in 1 2 3 7 8 11 12 16; do
            pdftoppm -f "$p" -l "$p" -r 132 -jpeg -jpegopt quality=78 -singlefile               source/02_conductors_half_size.pdf "evidence/workbook/page-$p"
            pdftotext -f "$p" -l "$p" -layout               source/02_conductors_half_size.pdf "evidence/workbook/page-$p.txt"
            echo "@@IMAGE_BEGIN_workbook-$p@@"
            base64 -w 112 "evidence/workbook/page-$p.jpg" | sed "s/^/@@B64_workbook-$p@@/"
            echo "@@IMAGE_END_workbook-$p@@"
            echo "@@TEXT_BEGIN_workbook-$p@@"
            head -c 3500 "evidence/workbook/page-$p.txt"
            echo "@@TEXT_END_workbook-$p@@"
          done
          echo "WORKBOOK_ORIGINAL_BYTES_SHA256_AND_8_RENDERED_PAGES_PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jee12-review02-workbook-page-jpegs
          path: evidence/workbook/
          if-no-files-found: warn

  notes-pdf-source:
    name: Real original notes 4 page JPEGs and binary hash
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: 975e2e23a86fe29bbaafebc20e684312d2aa5b6d
          path: source
          persist-credentials: false
      - name: Verify pinned production Git commit and native tree
        run: |
          test "$(git -C source rev-parse HEAD)" = "$PROD_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$PROD_TREE"
          git -C source rev-parse HEAD HEAD^{tree}
      - name: Hash ORIGINAL notes binary and render 4 PDF pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/notes
          test "$(sha256sum source/POTENTIAL_CONDUCTORS1.pdf | awk '{print $1}')" = "8d0d9b5cf821219058cfc4b7685a39b777e460944df44c3f9cffcb68157a60e5"
          sha256sum source/POTENTIAL_CONDUCTORS1.pdf | tee evidence/notes/real-source-sha256.txt
          pdfinfo source/POTENTIAL_CONDUCTORS1.pdf | head -25 | tee evidence/notes/pdfinfo.txt
          command -v pdftoppm
          for p in 26 27 69 70; do
            pdftoppm -f "$p" -l "$p" -r 132 -jpeg -jpegopt quality=78 -singlefile               source/POTENTIAL_CONDUCTORS1.pdf "evidence/notes/page-$p"
            pdftotext -f "$p" -l "$p" -layout               source/POTENTIAL_CONDUCTORS1.pdf "evidence/notes/page-$p.txt"
            echo "@@IMAGE_BEGIN_notes-$p@@"
            base64 -w 112 "evidence/notes/page-$p.jpg" | sed "s/^/@@B64_notes-$p@@/"
            echo "@@IMAGE_END_notes-$p@@"
            echo "@@TEXT_BEGIN_notes-$p@@"
            head -c 3500 "evidence/notes/page-$p.txt"
            echo "@@TEXT_END_notes-$p@@"
          done
          echo "NOTES_ORIGINAL_BYTES_SHA256_AND_4_RENDERED_PAGES_PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jee12-review02-notes-page-jpegs
          path: evidence/notes/
          if-no-files-found: warn

  independent-native:
    name: Independent released-API replay with original SI physics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: reviewer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: 975e2e23a86fe29bbaafebc20e684312d2aa5b6d
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned production Git commit and native tree
        run: |
          test "$(git -C source rev-parse HEAD)" = "$PROD_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$PROD_TREE"
          git -C source rev-parse HEAD HEAD^{tree}
      - name: Install exact released Python package for independent native execution
        working-directory: source
        run: python -m pip install -e . pytest
      - name: Execute reviewer-owned direct physical API experiments
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH="$PWD/src" python ../reviewer/projects/conductor_sim/pr-109/reviews/review-02-chat-b-native.py 2>&1 | tee ../review02-native.log
          cp review02-native-results.json ../review02-native-results.json
      - name: Preserve independent native script identity and source pin
        if: always()
        run: |
          {
            echo "source_head=$PROD_SHA"
            echo "source_tree=$PROD_TREE"
            git -C source rev-parse HEAD HEAD^{tree}
            sha256sum reviewer/projects/conductor_sim/pr-109/reviews/review-02-chat-b-native.py
          } | tee review02-native-provenance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jee12-review02-native-first-attempt
          path: |
            review02-native.log
            review02-native-results.json
            review02-native-provenance.txt
          if-no-files-found: warn
