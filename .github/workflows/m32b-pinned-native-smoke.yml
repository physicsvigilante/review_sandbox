name: M32b pinned native mixed ancestry focused smoke
on:
  push:
    paths:
      - ".github/workflows/m32b-pinned-native-smoke.yml"
  workflow_dispatch:
jobs:
  native-mixed-ancestry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: review-hub
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: c90956a5e4a26464115ff88a1d0dbd42b6fe56e7
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify literal source head and Git tree
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "c90956a5e4a26464115ff88a1d0dbd42b6fe56e7"
          test "$(git rev-parse HEAD^{tree})" = "a57d6b7743a7bc3b3fe7bcb4602b98b11bcbcfd6"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install native package and pytest
        working-directory: source
        run: python -m pip install -e ".[test]"
      - name: Execute genuine mixed-order world source and native event tests
        working-directory: source
        run: |
          set -o pipefail
          python -m pytest tests/test_m32b_certified_mixed_ancestry.py -q | tee ../m32b-smoke.log
      - name: Export actual v2 graph and check source ledger
        working-directory: source
        run: |
          python -m examples.m32b_mixed_ancestry --output output/m32b-actual.json | tee ../m32b-example.log
      - name: Retain original attempted evidence
        if: always()
        run: |
          test ! -f source/output/m32b-actual.json || sha256sum source/output/m32b-actual.json > m32b-sha256.txt
          test ! -f m32b-smoke.log || sha256sum m32b-smoke.log >> m32b-sha256.txt
          test ! -f m32b-example.log || sha256sum m32b-example.log >> m32b-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m32b-corrected-double-crossing-ancestry
          path: |
            m32b-smoke.log
            m32b-example.log
            m32b-sha256.txt
            source/output/m32b-actual.json
          if-no-files-found: warn
