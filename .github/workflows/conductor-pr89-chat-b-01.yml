name: Conductor PR89 Chat B independent first-attempt review

on:
  push:
    branches: [review/conductor-pr89-chat-b-20261118]
    paths:
      - '.github/workflows/conductor-pr89-chat-b-01.yml'
      - 'projects/conductor_sim/pr-89/reviews/*_chat_b.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  independent-science:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/source/src:${{ github.workspace }}/source
      EVIDENCE: ${{ github.workspace }}/review/projects/conductor_sim/pr-89/reviews/evidence/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout independent reviewer scripts
        uses: actions/checkout@v4
        with:
          path: review
      - name: Fresh production checkout at reviewed source SHA (read-only)
        uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: 75c984aaae18e44997332e330ed3a519a7b6a8da
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native Git and live PR identity hard stop
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python review/projects/conductor_sim/pr-89/reviews/audit_chat_b.py identity source "$EVIDENCE" 2>&1 | tee "$EVIDENCE/identity-first-attempt.log"
      - name: Original independent SI and adversarial challenges (failures stay red)
        id: challenges
        shell: bash
        run: |
          set -euo pipefail
          python review/projects/conductor_sim/pr-89/reviews/challenge_chat_b.py source "$EVIDENCE" 2>&1 | tee "$EVIDENCE/independent-first-attempt.log"
      - name: Read-only complete current-head CI and original red history
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python review/projects/conductor_sim/pr-89/reviews/audit_chat_b.py evidence source "$EVIDENCE" 2>&1 | tee "$EVIDENCE/ci-first-attempt.log"
      - name: Original workbook p8 raster and native PDF provenance
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdfinfo source/02_conductors_half_size.pdf > "$EVIDENCE/original-pdf-info.txt"
          pdftotext -layout source/02_conductors_half_size.pdf "$EVIDENCE/original-pdf-text.txt"
          pdftotext -f 8 -l 8 -layout source/02_conductors_half_size.pdf "$EVIDENCE/source-p08-text.txt"
          pdftoppm -f 8 -l 8 -scale-to 2200 -singlefile -png source/02_conductors_half_size.pdf "$EVIDENCE/source-p08"
          pdfseparate -f 8 -l 8 source/02_conductors_half_size.pdf "$EVIDENCE/source-page-%d.pdf"
          git -C source status --porcelain --untracked-files=no > "$EVIDENCE/production-worktree-status.txt"
          test ! -s "$EVIDENCE/production-worktree-status.txt"
      - name: Retain first-attempt evidence on reviewer branch, even for a failed review
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cd review
          git config user.name 'Chat B independent review evidence'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/conductor_sim/pr-89/reviews/evidence/
          if ! git diff --cached --quiet; then
            git commit -m "review(conductor-pr89): retain actual run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT evidence (including failures)"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Retain downloadable first-attempt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conductor-pr89-chat-b-first-attempt
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
