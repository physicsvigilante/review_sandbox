name: M34b pinned incremental native physical-world fork smoke 01
on:
  push:
    paths:
      - ".github/workflows/m34b-pinned-native-smoke01.yml"
  workflow_dispatch:
jobs:
  genuine-native-incremental-forks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: review-hub
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: bd999c9d3887893a8c53df6d4bab1e008d232bbf
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm actual source commit and Git tree
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "bd999c9d3887893a8c53df6d4bab1e008d232bbf"
          test "$(git rev-parse HEAD^{tree})" = "ec97c1e8d6919b69ccc4246600d655263f2e2aeb"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install genuine source native test requirements
        working-directory: source
        run: python -m pip install -e ".[test]"
      - name: Run all incremental physical source, event and hostile evidence regressions
        working-directory: source
        run: |
          set -o pipefail
          python -m pytest tests/test_m34b_incremental_world_forks.py -q | tee ../m34b-native-tests.log
      - name: Run and retain original and NEW physical worlds as finite JSON
        working-directory: source
        run: |
          set -o pipefail
          python -m examples.m34b_incremental_forks \
            --original-output output/m34b-source.json \
            --output output/m34b-fork.json | tee ../m34b-demo.log
      - name: Retain exact first-attempt original evidence digests
        if: always()
        run: |
          for file in m34b-native-tests.log m34b-demo.log source/output/m34b-source.json source/output/m34b-fork.json; do
            if [ -f "$file" ]; then sha256sum "$file"; fi
          done | tee m34b-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m34b-incremental-source-pinned-native-first-attempt
          path: |
            m34b-native-tests.log
            m34b-demo.log
            m34b-sha256.txt
            source/output/m34b-source.json
            source/output/m34b-fork.json
          if-no-files-found: warn
