name: "M30a source-to-parameter exact-head transfer evidence"
on:
  push:
    branches:
      - m30a-structural-parameter-transfer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  novel-source-parameter-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out review evidence scripts
        uses: actions/checkout@v4
        with:
          path: review_evidence
      - name: Check out EXACT pinned conductor_sim PR 69 head
        uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: 4d22b6966cfe2e704d26df8438c35bb22f2662f7
          path: review_evidence/native_source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned native source and independent numerical tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./review_evidence/native_source numpy scipy
      - name: Execute novel M30a native source-family parameter transfer and independent DOP853
        shell: bash
        run: |
          mkdir -p review_evidence/m30a-transfer-output
          set -o pipefail
          python review_evidence/projects/conductor_sim/pr-69/transfer/run_transfer.py | tee review_evidence/m30a-transfer-output/CI-stdout.txt
      - name: Archive original native samples, reference deviations, source and model digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m30a-novel-source-parameter-transfer
          path: review_evidence/m30a-transfer-output/
          retention-days: 30
          if-no-files-found: warn
