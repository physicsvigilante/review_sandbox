name: M35b first exact-source legacy sweep issuance and status smoke
on:
  push:
    paths:
      - ".github/workflows/m35b-source-smoke01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-m28a-m28b-legacy-native-and-hostility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: review-hub
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: 2e7f555dbba7c71d2cf5f80072484e20b6113077
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify literal source revision and Git tree
        run: |
          test "$(git -C source rev-parse HEAD)" = "2e7f555dbba7c71d2cf5f80072484e20b6113077"
          test "$(git -C source rev-parse HEAD^{tree})" = "7ec06ec5e30c437864edf77c0556a1f0038ad6d3"
      - name: Install native real source test package
        working-directory: source
        run: python -m pip install -e ".[test]"
      - name: Run true legacy M28a/M28b and new receipt hostile tests
        working-directory: source
        run: |
          set -o pipefail
          python -m pytest tests/test_m35b_legacy_sweep_evidence.py tests/test_m28a_trajectory_sweep.py tests/test_m28b_event_sweep.py -q | tee ../m35b-first-tests.log
      - name: Record original failed or successful scientific output
        if: always()
        run: |
          if [ -f m35b-first-tests.log ]; then sha256sum m35b-first-tests.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m35b-exact-source-first-hostile-native-regressions
          path: m35b-first-tests.log
          if-no-files-found: warn
