name: M32a Chat B review01 independently authored native probes
on:
  push:
    paths:
      - ".github/workflows/m32a-review01-independent.yml"
      - "projects/conductor_sim/pr-73/reviews/review-01-chat-b-probes.py"
  workflow_dispatch:

jobs:
  independent-review01:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: reviews
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: e62856ddcee5cdc2cae30cbaf3122d4d93e3a04a
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert exact independently reviewed source HEAD and tree
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "e62856ddcee5cdc2cae30cbaf3122d4d93e3a04a"
          test "$(git rev-parse HEAD^{tree})" = "b734f58ef92d5b4d7832f1a25d8457d65fbe5bf9"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install unchanged pinned production physics package
        working-directory: source
        run: python -m pip install -e .
      - name: Run NEW Chat B unfamiliar graph, independently expressed SI trajectory/roots and adversarial checks
        working-directory: source
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/src" python ../reviews/projects/conductor_sim/pr-73/reviews/review-01-chat-b-probes.py ../review01-native-evidence.json 2>&1 | tee ../review01-native.log
      - name: Retain original first-attempt evidence
        if: always()
        run: |
          sha256sum reviews/projects/conductor_sim/pr-73/reviews/review-01-chat-b-probes.py > review01-digests.txt
          test ! -f review01-native-evidence.json || sha256sum review01-native-evidence.json >> review01-digests.txt
          test ! -f review01-native.log || sha256sum review01-native.log >> review01-digests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m32a-chat-b-review01-first-attempt
          path: |
            review01-native-evidence.json
            review01-native.log
            review01-digests.txt
          if-no-files-found: warn
