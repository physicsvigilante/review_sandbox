name: M34b Chat B independent R2 review01 exact-source science
on:
  push:
    paths:
      - ".github/workflows/m34b-review01-chat-b-independent.yml"
      - "projects/conductor_sim/pr-79/reviews/review-01-chat-b-probes.py"
  workflow_dispatch:
jobs:
  new-science:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout independent reviewer scripts
        uses: actions/checkout@v4
        with:
          path: review
      - name: Checkout literal pinned candidate (not synthetic merge)
        uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: 5d7a6d195e14c6858540066586b6b40a44160b9b
          path: candidate
      - name: Validate source head and real Git tree
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = "5d7a6d195e14c6858540066586b6b40a44160b9b"
          test "$(git rev-parse HEAD^{tree})" = "d0646c9e4d518008784c42c1fec1c48c81901a09"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install untouched source package
        working-directory: candidate
        run: python -m pip install -e .
      - name: Execute independent new physical science and provenance attacks
        working-directory: candidate
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/src" python ../review/projects/conductor_sim/pr-79/reviews/review-01-chat-b-probes.py --out ../review01-new 2>&1 | tee ../review01-first-attempt.log
      - name: Record attempted source identity and immutable artifacts
        if: always()
        run: |
          ( cd candidate && git rev-parse HEAD && git rev-parse HEAD^{tree} ) > review01-identity.txt
          find review01-new -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum > review01-digests.txt
          sha256sum review/projects/conductor_sim/pr-79/reviews/review-01-chat-b-probes.py review01-first-attempt.log >> review01-digests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m34b-chat-b-first-attempt-new-science
          path: |
            review01-new/
            review01-first-attempt.log
            review01-identity.txt
            review01-digests.txt
          if-no-files-found: warn

  legacy-base-vs-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: review
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: ecb6740fff851e0dbce2c2784a173638155a9acb
          path: released
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: 5d7a6d195e14c6858540066586b6b40a44160b9b
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check both exact source commits AND native trees
        run: |
          test "$(cd released && git rev-parse HEAD)" = "ecb6740fff851e0dbce2c2784a173638155a9acb"
          test "$(cd released && git rev-parse HEAD^{tree})" = "87b1271d437a5bcc58f9328cca9773827a3da7d8"
          test "$(cd candidate && git rev-parse HEAD)" = "5d7a6d195e14c6858540066586b6b40a44160b9b"
          test "$(cd candidate && git rev-parse HEAD^{tree})" = "d0646c9e4d518008784c42c1fec1c48c81901a09"
      - name: Run fresh original-source native legacy reference
        working-directory: released
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/src" python ../review/projects/conductor_sim/pr-79/reviews/review-01-chat-b-probes.py --legacy-only --out ../legacy-released 2>&1 | tee ../legacy-released.log
      - name: Run fresh candidate-source native legacy reference
        working-directory: candidate
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/src" python ../review/projects/conductor_sim/pr-79/reviews/review-01-chat-b-probes.py --legacy-only --out ../legacy-candidate 2>&1 | tee ../legacy-candidate.log
      - name: Compare complete original native JSON byte for byte
        run: |
          for file in v1.json v2.json v3.json inquiry.json; do
            cmp "legacy-released/$file" "legacy-candidate/$file"
            sha256sum "legacy-released/$file" "legacy-candidate/$file"
          done
          echo "ALL FOUR REVIEWER-AUTHORED LEGACY FILES BYTE IDENTICAL"
      - name: Record historical first-attempt comparison output
        if: always()
        run: |
          find legacy-released legacy-candidate -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum > review01-legacy-digests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m34b-chat-b-first-attempt-legacy-bytes
          path: |
            legacy-released/
            legacy-candidate/
            legacy-released.log
            legacy-candidate.log
            review01-legacy-digests.txt
          if-no-files-found: warn
