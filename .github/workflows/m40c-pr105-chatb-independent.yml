name: M40c PR105 fresh Chat B independent Kelvin and true Chromium
on:
  pull_request:
    paths:
      - "projects/conductor_sim/pr-105/reviews/**"
      - ".github/workflows/m40c-pr105-chatb-independent.yml"
  push:
    branches:
      - review/conductor-pr105-m40c-chat-b-01-20261120
    paths:
      - "projects/conductor_sim/pr-105/reviews/**"
      - ".github/workflows/m40c-pr105-chatb-independent.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-independent-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: reviews
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: 33a1c677fd9c68404fc64b44496c08fb2c3cee7b
          fetch-depth: 0
          path: source
      - name: Native source HEAD/TREE and exact nine-file baseline/charter controls
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          git rev-parse HEAD | tee ../evidence/production-head.txt
          git rev-parse HEAD^{tree} | tee ../evidence/production-tree.txt
          test "$(git rev-parse HEAD)" = 33a1c677fd9c68404fc64b44496c08fb2c3cee7b
          test "$(git rev-parse HEAD^{tree})" = 02688024e08f8f0726b5399233e50daa0744c855
          test "$(git write-tree)" = 02688024e08f8f0726b5399233e50daa0744c855
          git merge-base --is-ancestor 337001f2e0d1ce62c87fa4352993c4a074cfbde6 HEAD
          git merge-base --is-ancestor 5fb0294ac8a1317d61524d1b0a9ba63edf66a354 HEAD
          git merge-base --is-ancestor d3e77511ab1920393eb457da39561c0849926a7e HEAD
          test "$(git show 5fb0294ac8a1317d61524d1b0a9ba63edf66a354:docs/m40c_charter.md | git hash-object --stdin)" = "$(git hash-object docs/m40c_charter.md)"
          sha256sum docs/m40c_charter.md 02_conductors_half_size.pdf POTENTIAL_CONDUCTORS1.pdf | tee ../evidence/sources.sha256
          test "$(sha256sum 02_conductors_half_size.pdf | awk '{print $1}')" = 9dff3c02a9f1848d2c3d99cb1a6e7a44dc7f5a51f7a3a2b8cc92d10ce1fbca5d
          test "$(sha256sum POTENTIAL_CONDUCTORS1.pdf | awk '{print $1}')" = 8d0d9b5cf821219058cfc4b7685a39b777e460944df44c3f9cffcb68157a60e5
          git diff --name-only 337001f2e0d1ce62c87fa4352993c4a074cfbde6 HEAD | sort | tee ../evidence/changed-files.txt
          cat > ../evidence/expected-files.txt <<'EOF'
          .github/workflows/m40c-static-relocation.yml
          docs/m40c.md
          docs/m40c_charter.md
          src/conductor_sim/spherical_sigma_relocation.py
          src/conductor_sim/spherical_sigma_relocation_viewer.py
          tests/test_m40c_static_relocation.py
          tools/check_m40c_static_browser.py
          tools/m40c_static_example.py
          tools/m40c_static_reference.py
          EOF
          diff ../evidence/expected-files.txt ../evidence/changed-files.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unchanged source and independent numerical/browser tools
        working-directory: source
        run: |
          python -m pip install -e '.[test]' 'mpmath==1.3.0' 'playwright==1.57.0'
          python -m playwright install chromium
      - name: Execute independently authored novel translated source, Kelvin, malicious records and actual Chromium
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD:$PWD/src" python ../reviews/projects/conductor_sim/pr-105/reviews/review-01-chat-b-probes.py --out ../evidence 2>&1 | tee ../evidence/first-review-run.log
          test -s ../evidence/reviewer-results.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('../evidence/reviewer-results.json').read_text())
          assert evidence['status']=='PASS'
          assert evidence['head']=='33a1c677fd9c68404fc64b44496c08fb2c3cee7b'
          assert len(evidence['physics'])==48
          assert len(evidence['browser'])==4
          assert evidence['script_injection_blocked']
          assert evidence['edited_html_not_authenticated_by_json_checker']
          assert evidence['css_tamper_can_hide_truthful_notice']
          print("Independent four-mode browser/numerical acceptance checks PASS")
          PY
      - name: Preserve reviewer evidence identity and first actual failures
        shell: bash
        if: always()
        run: |
          mkdir -p evidence
          sha256sum reviews/projects/conductor_sim/pr-105/reviews/review-01-chat-b-probes.py > evidence/reviewer-script.sha256
          find evidence -maxdepth 1 -type f -printf '%f\n' | sort > evidence/artifact-index.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m40c-pr105-chatb-first-attempt-independent-signed-physics-and-browser
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
