name: M31b independent review03 corrected-source provenance probes
on:
  push:
    paths:
      - ".github/workflows/m31b-review03-independent.yml"
      - "projects/conductor_sim/pr-72/reviews/review-03-chat-b-probes.py"
  workflow_dispatch:
jobs:
  independent-review03:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: reviews
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: 7f52376c197d4667dba8c54463f995fce4d7df73
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact literal production source HEAD and Git tree
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "7f52376c197d4667dba8c54463f995fce4d7df73"
          test "$(git rev-parse HEAD^{tree})" = "fe3df0fff668887d8f938b8be35ea124f6b22816"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install unchanged production package
        working-directory: source
        run: python -m pip install -e .
      - name: Execute NEW independent Chat B F-04 attacks and native positive controls
        working-directory: source
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/src" python ../reviews/projects/conductor_sim/pr-72/reviews/review-03-chat-b-probes.py 2>&1 | tee ../review03-native.log
      - name: Independently rerun UNCHANGED historic Chat B review02 native controls on exact new source
        working-directory: source
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/src" python ../reviews/projects/conductor_sim/pr-72/reviews/review-02-chat-b-probes.py 2>&1 | tee ../review03-retained-native.log
      - name: Verify historic probe PASS and rejection statuses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("review02-results.json").read_text())
          assert doc["issues"] == [], doc["issues"]
          for name in ("F04_HYPOTHESIS_PROVENANCE_REBIND", "F04_PLAN_ID_REBIND",
                       "F01_NEW_DIRECT_CONSTRUCTOR", "F01_COPY_ORIGINAL_SEAL",
                       "F01_AFTER_CONSTRUCTION_EXPORT",
                       "F02_PARENT_MISSING_OBSERVATION", "F02_CHILD_MISSING_OBSERVATION",
                       "F03_FORGED_CHILD_EVENT_AT_CONSTRUCTOR"):
              assert doc["outcomes"][name]["outcome"] == "REJECTED", name
          for name in ("NATIVE_ROD_REFERENCE",
                       "F02_GENUINE_REFUSAL_PARENT_CHILD_SUCCEEDS",
                       "F03_NO_RESCUE_VALID_SIBLING_PRESERVED",
                       "NOVEL_GRAVITY_EY_ANALYTIC_NATIVE"):
              assert doc["outcomes"][name]["outcome"] == "PASS", name
          print("REVIEW03_RETAINED_CONTROLS_PASS; script historic SHA fields are not the new checkout identity")
          PY
      - name: Independently rerun UNCHANGED reviewer02 F-01 F-02 F-03 and analytic probes
        working-directory: source
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/src" python ../reviews/projects/conductor_sim/pr-72/reviews/review-02-chat-b-probes.py 2>&1 | tee ../review03-legacy-controls.log
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("../review02-results.json").read_text())
          assert a["issues"] == [], a["issues"]
          required = {
            "F04_HYPOTHESIS_PROVENANCE_REBIND": "REJECTED",
            "F04_PLAN_ID_REBIND": "REJECTED",
            "F03_NO_RESCUE_VALID_SIBLING_PRESERVED": "PASS",
            "F02_GENUINE_REFUSAL_PARENT_CHILD_SUCCEEDS": "PASS",
            "NOVEL_GRAVITY_EY_ANALYTIC_NATIVE": "PASS",
            "NATIVE_ROD_REFERENCE": "PASS",
            "F01_AFTER_CONSTRUCTION_EXPORT": "REJECTED",
            "F02_PARENT_MISSING_OBSERVATION": "REJECTED",
            "F02_CHILD_MISSING_OBSERVATION": "REJECTED",
          }
          for key, expected in required.items():
              assert a["outcomes"][key]["outcome"] == expected, (key, a["outcomes"].get(key))
          print("REVIEW03 PRIOR INDEPENDENT F01 F02 F03 CONTROLS PASS")
          print("NOTE original historic review02 source pins embedded in script outputs are not checkout claims")
          PY
      - name: Preserve first-attempt evidence digests
        if: always()
        run: |
          sha256sum reviews/projects/conductor_sim/pr-72/reviews/review-03-chat-b-probes.py > review03-digests.txt
          sha256sum reviews/projects/conductor_sim/pr-72/reviews/review-02-chat-b-probes.py >> review03-digests.txt
          test ! -f review03-results.json || sha256sum review03-results.json >> review03-digests.txt
          test ! -f review03-native.log || sha256sum review03-native.log >> review03-digests.txt
          test ! -f review03-legacy-controls.log || sha256sum review03-legacy-controls.log >> review03-digests.txt
          test ! -f review02-results.json || sha256sum review02-results.json >> review03-digests.txt
          test ! -f review03-retained-native.log || sha256sum review03-retained-native.log >> review03-digests.txt
          test ! -f review02-results.json || sha256sum review02-results.json >> review03-digests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m31b-independent-review03-first-attempt
          path: |
            review03-results.json
            review03-native.log
            review03-retained-native.log
            review02-results.json
            review03-digests.txt
          if-no-files-found: warn
