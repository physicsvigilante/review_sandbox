name: "M29b independent R2 transfer closure evidence"
on:
  push:
    branches:
      - m29b-r2-transfer-evidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-native-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out review evidence
        uses: actions/checkout@v4
        with:
          path: review_evidence
      - name: Check out EXACT PR 68 native source
        uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: fe63cab1994b702e7e55348a122ee76f9f5e10ed
          path: review_evidence/native_source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact native package and independent reference/browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./review_evidence/native_source numpy scipy playwright
          python -m playwright install --with-deps chromium
      - name: Execute unfamiliar native M29b input against independent quadrature and DOP853
        run: |
          mkdir -p review_evidence/m29b-r2-transfer-output
          set -o pipefail
          python review_evidence/projects/conductor_sim/pr-68/transfer/run_transfer.py | tee review_evidence/m29b-r2-transfer-output/CI-stdout.txt
      - name: Preserve original native result, browser images, source hashes and full receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m29b-r2-novel-native-transfer
          path: review_evidence/m29b-r2-transfer-output/
          if-no-files-found: warn
          retention-days: 30
