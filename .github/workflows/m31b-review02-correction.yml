name: M31b targeted review02 F-04 corrected exact-source probes
on:
  push:
    paths:
      - ".github/workflows/m31b-review02-correction.yml"
      - "projects/conductor_sim/pr-72/reviews/review-02-chat-b-probes.py"
  workflow_dispatch:
jobs:
  corrected-review02-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: reviews
      - uses: actions/checkout@v4
        with:
          repository: physicsvigilante/conductor_sim
          ref: 7f52376c197d4667dba8c54463f995fce4d7df73
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify literal source HEAD and Git tree
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "7f52376c197d4667dba8c54463f995fce4d7df73"
          test "$(git rev-parse HEAD^{tree})" = "fe3df0fff668887d8f938b8be35ea124f6b22816"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install corrected native source
        working-directory: source
        run: python -m pip install -e .
      - name: Re-execute unchanged reviewer-authored Chat B probes on corrected source
        working-directory: source
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/src" python ../reviews/projects/conductor_sim/pr-72/reviews/review-02-chat-b-probes.py 2>&1 | tee ../review02-native.log
      - name: Verify F-04 and older reviewer attacks are all rejected
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("review02-results.json").read_text())
          assert doc["issues"] == [], doc["issues"]
          statuses = doc["outcomes"]
          for label in ("F04_HYPOTHESIS_PROVENANCE_REBIND",
                        "F04_PLAN_ID_REBIND"):
              assert statuses[label]["outcome"] == "REJECTED", (label,statuses[label])
          for label in ("NOVEL_GRAVITY_EY_ANALYTIC_NATIVE",
                        "F02_GENUINE_REFUSAL_PARENT_CHILD_SUCCEEDS",
                        "F03_NO_RESCUE_VALID_SIBLING_PRESERVED"):
              assert statuses[label]["outcome"] == "PASS", (label,statuses[label])
          print("REVIEW02 UNCHANGED PROBES: F-04 CLOSED, prior controls PASSED")
          PY
      - name: Preserve source identity, logs and result artifacts
        if: always()
        run: |
          sha256sum reviews/projects/conductor_sim/pr-72/reviews/review-02-chat-b-probes.py > review02-digests.txt
          test ! -f review02-results.json || sha256sum review02-results.json >> review02-digests.txt
          test ! -f review02-native.log || sha256sum review02-native.log >> review02-digests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m31b-developer-review02-correction-probes
          path: |
            review02-results.json
            review02-native.log
            review02-digests.txt
          if-no-files-found: warn
